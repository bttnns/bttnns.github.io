# Dependabot config: monthly, grouped updates.
version: 2
updates:
  # Keep the Actions pinned in .github/workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  # Keep the build tools pinned in .github/scripts up to date, but never to a
  # release less than two weeks old.
  - package-ecosystem: npm
    directory: /.github/scripts
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      build-tools:
        patterns:
          - "*"
