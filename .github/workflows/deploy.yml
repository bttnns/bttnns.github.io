name: Deploy (obfuscated) to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing here may publish the site except the deploy job, which asks for
# that right itself. The build job runs third-party tools and only reads.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install the build tools
        # Exactly the versions in .github/scripts/package-lock.json, checked
        # against its hashes, and without running any package's install
        # script. Nothing later in this job downloads a tool.
        run: |
          npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund
          echo "$PWD/.github/scripts/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Stage source
        run: rsync -a --exclude='.git' --exclude='.github' --exclude='Makefile' --exclude='/atc' --exclude='/privacy' --exclude='/folds' ./ stage/

      - name: Inject cache-busting version into asset URLs
        run: |
          SHORT="${{ github.sha }}"
          SHORT="${SHORT:0:8}"
          sed -i "s|/a/site\.css\"|/a/site.css?v=$SHORT\"|" stage/index.html
          sed -i "s|/a/site\.js\"|/a/site.js?v=$SHORT\"|" stage/index.html

      - name: Rename CSS classes
        # Gives every class a short random name, in the stylesheet and in the
        # class attributes of the pages, and nowhere else: text, alt text,
        # meta content and scripts pass through untouched. The classes that
        # site.js needs by name are listed in the script.
        run: node .github/scripts/site-classes.mjs rename stage mangled class-map.json

      - name: Assemble dist/ (JS obfuscation + minify, from the class-mangled tree)
        run: |
          rsync -a mangled/ dist/
          cp -R atc privacy folds dist/
          touch dist/.nojekyll

          javascript-obfuscator mangled/a/site.js --output dist/a/site.js \
            --compact true \
            --control-flow-flattening true \
            --control-flow-flattening-threshold 0.75 \
            --dead-code-injection true \
            --dead-code-injection-threshold 0.3 \
            --string-array true \
            --string-array-encoding 'base64' \
            --string-array-threshold 0.8 \
            --identifier-names-generator hexadecimal \
            --self-defending true \
            --simplify true

          cleancss -o dist/a/site.css mangled/a/site.css

          for f in index.html health.html; do
            html-minifier-terser \
              --collapse-whitespace \
              --remove-comments \
              --minify-css true \
              "mangled/$f" -o "dist/$f"
          done

      - name: Check that the build changed nothing a visitor reads
        # Fails the deploy if any text, attribute or copied file in dist/
        # differs from the source by more than a renamed class.
        run: node .github/scripts/site-classes.mjs verify class-map.json stage dist atc privacy folds

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
